<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="none">
  <defs>
    <!-- Gradientes de las dos marcas -->
    <linearGradient id="alesBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="alesHeartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="ipsOrangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="ipsGreenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LADO IZQUIERDO: Fundación ALES (Corazón con alas celestes y estrellas lima) -->
  <g filter="url(#softGlow)">
    <!-- Alas de ALES -->
    <path d="M4 14 C1 10 3 6 7 7 C10 8 13 11 15 15 C11 13 6 12 4 14Z" fill="#64B5F6" opacity="0.9"/>
    <path d="M2 19 C0.5 16 2 13 5 14 C8 15 11 18 13 22 C9 19 5 18 2 19Z" fill="#90CAF9" opacity="0.8"/>
    <path d="M24 14 C27 10 25 6 21 7 C18 8 15 11 13 15 C17 13 22 12 24 14Z" fill="#64B5F6" opacity="0.9"/>
    
    <!-- Corazón azul principal -->
    <path d="M14 11 C11 7 5 7 5 14 C5 19.5 11 24 14 27 C17 24 23 19.5 23 14 C23 7 17 7 14 11Z" fill="url(#alesBlueGrad)"/>

    <!-- Núcleo de amor (corazón interior de ALES) -->
    <path d="M14 14.5 C12.5 12 9 12 9 15.5 C9 18.5 12.5 21 14 22.5 C15.5 21 19 18.5 19 15.5 C19 12 15.5 12 14 14.5Z" fill="url(#alesHeartGrad)"/>
    
    <!-- Estrellas verdes lima de ALES (Luz y Esperanza) -->
    <polygon points="14,2 14.8,4.2 17,4.2 15.2,5.5 15.8,7.5 14,6.2 12.2,7.5 12.8,5.5 11,4.2 13.2,4.2" fill="#7CB518"/>
    <polygon points="8,4 8.5,5.5 10,5.5 8.8,6.4 9.2,7.8 8,6.9 6.8,7.8 7.2,6.4 6,5.5 7.5,5.5" fill="#88C022" opacity="0.85"/>
    <polygon points="20,4 20.5,5.5 22,5.5 20.8,6.4 21.2,7.8 20,6.9 18.8,7.8 19.2,6.4 18,5.5 19.5,5.5" fill="#88C022" opacity="0.85"/>
  </g>

  <!-- LADO DERECHO: IPS Restaurando Vidas (3 personas en ronda unida) -->
  <g filter="url(#softGlow)">
    <!-- Figura 1: Naranja (cabeza + arco cuerpo) -->
    <circle cx="34" cy="9" r="3.2" fill="url(#ipsOrangeGrad)"/>
    <path d="M30 18 C30 14 38 14 38 18 C38 19.5 30 19.5 30 18Z" fill="url(#ipsOrangeGrad)"/>
    <path d="M29 20 C27 16 33 13 37 15" stroke="url(#ipsOrangeGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Figura 2: Verde (cabeza + arco cuerpo superior) -->
    <circle cx="43" cy="15" r="3.2" fill="url(#ipsGreenGrad)"/>
    <path d="M40 24 C40 20 46 20 46 24" stroke="url(#ipsGreenGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Figura 3: Azul (cabeza + arco cuerpo inferior) -->
    <circle cx="37" cy="27" r="3.2" fill="url(#alesBlueGrad)"/>
    <path d="M31 34 C31 30 43 30 43 34" stroke="url(#alesBlueGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Anillo conector unificador (Ronda que une ambas misiones) -->
    <path d="M25 24 C28 29 36 33 41 29 C45 25 45 17 39 13 C35 11 29 14 26 18" stroke="#7CB518" stroke-width="1.6" stroke-dasharray="1 1" opacity="0.75" fill="none"/>
  </g>
</svg>
